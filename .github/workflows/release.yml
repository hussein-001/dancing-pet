name: Release

# Runs when a release tag is pushed. Tags are made by `claude plugin tag`,
# named dancing-pet--v<version> after the version in .claude-plugin/plugin.json.
on:
  push:
    tags:
      - 'dancing-pet--v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches plugin.json
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME##*--v}"
          manifest_version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $manifest_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { on = index($0, "[" v "]") > 0; next }
            /^\[.*\]: / { next }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "dancing-pet v$VERSION" \
            --notes-file notes.md \
            --verify-tag
